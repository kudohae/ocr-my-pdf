<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF OCR</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172236; background: #f4f6f8; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 540px); background: white; border: 1px solid #e1e5eb; border-radius: 18px; padding: clamp(24px, 6vw, 42px); box-shadow: 0 12px 38px #1722360c; }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -.04em; }
    p { color: #586577; line-height: 1.55; margin: 0 0 26px; }
    .drop { display: block; border: 2px dashed #aab8ca; border-radius: 14px; padding: 40px 20px; text-align: center; cursor: pointer; background: #fafcff; transition: background .15s, border-color .15s; }
    .drop:hover, .drop.dragging, .drop:focus-within { background: #edf5ff; border-color: #2873d8; }
    .drop strong { display: block; font-size: 17px; margin-bottom: 7px; overflow-wrap: anywhere; }
    .drop span { color: #657387; font-size: 14px; }
    input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
    label[for=language] { display: block; margin: 24px 0 8px; font-weight: 600; font-size: 14px; }
    select, button { width: 100%; min-height: 46px; border-radius: 9px; font: inherit; }
    select { padding: 0 12px; border: 1px solid #c8d1dc; background: white; color: inherit; }
    button { margin-top: 22px; border: 0; background: #1763c4; color: white; font-weight: 700; cursor: pointer; }
    button:hover:not(:disabled) { background: #0c52a9; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #status { min-height: 24px; margin: 18px 0 0; font-size: 14px; }
    #status.error { color: #b42318; }
    .note { margin: 22px 0 0; font-size: 13px; color: #6c798a; }
  </style>
</head>
<body>
  <main>
    <h1>PDF OCR</h1>
    <p>스캔한 PDF에 검색·복사할 수 있는 텍스트를 추가합니다.</p>
    <form id="form">
      <label class="drop" id="drop" for="file">
        <strong id="file-label">PDF 파일을 선택하거나 여기에 놓으세요</strong>
        <span>최대 100 MB</span>
      </label>
      <input id="file" name="file" type="file" accept=".pdf,application/pdf" required>
      <label for="language">문서 언어</label>
      <select id="language" name="language">
        <option value="kor+eng">한국어 + 영어</option>
        <option value="kor">한국어</option>
        <option value="eng">영어</option>
        <option value="rus+eng">러시아어 + 영어</option>
        <option value="rus">러시아어</option>
        <option value="kor+rus">한국어 + 러시아어</option>
      </select>
      <button id="submit" type="submit" disabled>OCR 시작</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="note">처리한 파일은 다운로드 후 서버에서 삭제됩니다.</p>
  </main>
  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('file');
    const drop = document.getElementById('drop');
    const button = document.getElementById('submit');
    const label = document.getElementById('file-label');
    const status = document.getElementById('status');
    const limit = 100 * 1024 * 1024;
    let selectedFile = null;

    function selectFile(file) {
      selectedFile = file || null;
      label.textContent = selectedFile ? selectedFile.name : 'PDF 파일을 선택하거나 여기에 놓으세요';
      button.disabled = !selectedFile;
      status.textContent = '';
      status.className = '';
    }
    input.addEventListener('change', () => selectFile(input.files[0]));
    for (const eventName of ['dragenter', 'dragover']) {
      drop.addEventListener(eventName, event => { event.preventDefault(); drop.classList.add('dragging'); });
    }
    for (const eventName of ['dragleave', 'drop']) {
      drop.addEventListener(eventName, event => { event.preventDefault(); drop.classList.remove('dragging'); });
    }
    drop.addEventListener('drop', event => selectFile(event.dataTransfer.files[0]));

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!selectedFile) return;
      if (!selectedFile.name.toLowerCase().endsWith('.pdf') || selectedFile.size > limit) {
        status.textContent = selectedFile.size > limit ? 'PDF는 100 MB 이하만 처리할 수 있습니다.' : 'PDF 파일을 선택해 주세요.';
        status.className = 'error';
        return;
      }
      button.disabled = true;
      button.textContent = '처리 중…';
      status.textContent = 'OCR 처리 중입니다. 페이지 수에 따라 몇 분 걸릴 수 있습니다.';
      status.className = '';
      const body = new FormData();
      body.append('file', selectedFile);
      body.append('language', document.getElementById('language').value);
      try {
        const response = await fetch('/ocr', { method: 'POST', body });
        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          throw new Error(error.detail || 'OCR 처리에 실패했습니다.');
        }
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = selectedFile.name.replace(/\.pdf$/i, '') + '-ocr.pdf';
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        status.textContent = '완료했습니다. OCR PDF를 다운로드했습니다.';
      } catch (error) {
        status.textContent = error.message || 'OCR 처리에 실패했습니다.';
        status.className = 'error';
      } finally {
        button.disabled = false;
        button.textContent = 'OCR 시작';
      }
    });
  </script>
</body>
</html>
